<svg xmlns="http://www.w3.org/2000/svg" width="288" height="620" viewBox="0 0 288 620" role="img" aria-labelledby="title desc">
  <title id="title">2025年度 中学3年生の夏期成績推移</title>
  <desc id="desc">同一集団のハレルノート生平均。全模試受験者との平均点差はマイナス11.3点、プラス13.3点、プラス28.6点へ推移した。</desc>
